name: Release build

# Builds the app for each OS, smoke tests the packaged result, and on a version
# tag attaches the downloads to a GitHub Release. "Run workflow" builds without
# releasing (downloads are then under the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Any well-known Yahoo symbol: only used to check that the packaged app can
  # reach Yahoo. The result is reported, never fatal. Not used by the app itself.
  SMOKE_QUOTE_SYMBOL: MSFT

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64, optional: false }
          - { os: macos-15, label: macos-apple-silicon, optional: false }
          - { os: macos-15-intel, label: macos-intel, optional: false }
          # Linux is best effort and must never block a release.
          - { os: ubuntu-22.04, label: linux-x64, optional: true }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libdbus-1-3 libfontconfig1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xkb1

      - name: Install project and build tools
        run: python -m pip install -e ".[dev,build]"

      - name: Read app version
        id: meta
        shell: bash
        run: echo "version=$(python -c 'import statement_tracker; print(statement_tracker.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version="${{ steps.meta.outputs.version }}"
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *) echo "::error::Tag $GITHUB_REF_NAME does not match app version $version"; exit 1 ;;
          esac

      - name: Run tests
        run: python -m pytest

      - name: Build app folder with PyInstaller
        run: python -m PyInstaller packaging/statement_tracker.spec --noconfirm

      - name: Record exact dependency versions
        shell: bash
        run: python -m pip freeze > "dist/pip-freeze-${{ matrix.label }}.txt"

      # ---------------------------------------------------------------- Windows
      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe" |
              Select-Object -First 1 -ExpandProperty FullName
          }
          & $iscc "/DAppVersion=${{ steps.meta.outputs.version }}" packaging\windows_installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install silently and smoke test the installed app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\*-windows-x64-setup.exe | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP 'installed-app'
          $install = Start-Process $setup.FullName -Wait -PassThru -ArgumentList `
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$target"
          if ($install.ExitCode -ne 0) { throw "Installer exited with code $($install.ExitCode)" }
          python packaging/smoke_check.py `
            --exe "$target\StatementPortfolioTracker.exe" `
            --sample samples/revolut_sample.csv `
            --label "${{ matrix.label }}" `
            --bundle-dir $target `
            --artifact $setup.FullName `
            --quote $env:SMOKE_QUOTE_SYMBOL `
            --report "dist\build-report-${{ matrix.label }}.md"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ------------------------------------------------------------------ macOS
      - name: Build macOS disk image
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          app="dist/Statement Portfolio Tracker.app"
          dmg="dist/StatementPortfolioTracker-${{ steps.meta.outputs.version }}-${{ matrix.label }}.dmg"
          codesign --verify --deep --strict "$app" || echo "::warning::codesign could not verify the ad-hoc signature"
          mkdir dist/dmg
          ditto "$app" "dist/dmg/Statement Portfolio Tracker.app"
          ln -s /Applications dist/dmg/Applications
          for attempt in 1 2 3; do
            if hdiutil create -volname "Statement Portfolio Tracker" -srcfolder dist/dmg -ov -format UDZO "$dmg"; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      - name: Smoke test the app from the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mount="$(mktemp -d)"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$mount"
          trap 'hdiutil detach "$mount" -force || true' EXIT
          app="$mount/Statement Portfolio Tracker.app"
          python packaging/smoke_check.py \
            --exe "$app/Contents/MacOS/StatementPortfolioTracker" \
            --sample samples/revolut_sample.csv \
            --label "${{ matrix.label }}" \
            --bundle-dir "$app" \
            --artifact "$DMG" \
            --quote "$SMOKE_QUOTE_SYMBOL" \
            --report "dist/build-report-${{ matrix.label }}.md"
          # Informational: the oldest macOS the bundled Qt supports.
          qt_core="$(find "$app" -type f -name QtCore | head -n 1 || true)"
          if [ -n "$qt_core" ]; then
            {
              echo "Oldest macOS supported by the bundled Qt (${{ matrix.label }}):"
              echo '```'
              vtool -show-build "$qt_core" | grep -E 'minos|platform' || true
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY" >> "dist/build-report-${{ matrix.label }}.md"
          fi

      # ------------------------------------------------------------------ Linux
      - name: Package and smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          archive="dist/StatementPortfolioTracker-${{ steps.meta.outputs.version }}-${{ matrix.label }}.tar.gz"
          tar -C dist -czf "$archive" StatementPortfolioTracker
          python packaging/smoke_check.py \
            --exe dist/StatementPortfolioTracker/StatementPortfolioTracker \
            --sample samples/revolut_sample.csv \
            --label "${{ matrix.label }}" \
            --bundle-dir dist/StatementPortfolioTracker \
            --artifact "$archive" \
            --quote "$SMOKE_QUOTE_SYMBOL" \
            --report "dist/build-report-${{ matrix.label }}.md"

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: StatementPortfolioTracker-${{ matrix.label }}
          path: |
            dist/*-setup.exe
            dist/*.dmg
            dist/*.tar.gz
            dist/build-report-*.md
            dist/pip-freeze-*.txt
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release and attach the downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          files=(artifacts/**/*-setup.exe artifacts/**/*.dmg artifacts/**/*.tar.gz)
          flags=()
          # Tags with a suffix (v0.0.1-spike) are published as pre-releases.
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes "${flags[@]}"
